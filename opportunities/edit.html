<!-- This page is where providers can edit and resubmit rejected opportunities -->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Edit Opportunity</title>
        <link rel="stylesheet" href="../styles/index.css" />
        <link rel="stylesheet" href="./styles/common.css" />
        <link rel="stylesheet" href="./styles/create.css" />
    </head>
    <body>
        <nav>
            <h1 id="app-name">SA - Learnerships</h1>
            <ul>
                <li id="notifications">
                    <img src="/assets/notifications.png" />
                    <p id="count">2</p>
                </li>
                <li id="profile-details">
                    <section>
                        <h4></h4>
                        <p></p>
                    </section>
                    <h3></h3>
                </li>
            </ul>
        </nav>
        <main>
            <aside>
                <ul id="sidebar-options">
                    <li>
                        <section id="opportunities-nav" class="heading">
                            <p>Opportunities</p>
                            <img id="opportunities-nav-image" src="/assets/down-arrow.png" />
                        </section>
                        <section id="opportunities-nav-options"></section>
                    </li>
                    <li>
                        <section class="heading">
                            <p>Your Account</p>
                            <img src="/assets/right-arrow.png" />
                        </section>
                    </li>
                    <li>
                        <section class="heading">
                            <p>Settings</p>
                            <img src="/assets/right-arrow.png" />
                        </section>
                    </li>
                </ul>
            </aside>
            <section id="main-details">
                <h2 id="page-title">Edit Opportunity</h2>
                <p id="page-description">
                    Update the details of your rejected opportunity and resubmit it for review.
                    All fields marked with * are required.
                </p>
                <form id="edit-opportunity-form">
                    <section class="input-group">
                        <section class="required-group">
                            <label for="title">Title:</label>
                            <p>*</p>
                        </section>
                        <section class="input-wrapper">
                            <input
                                type="text"
                                id="title"
                                name="title"
                                placeholder="Enter the title of the opportunity"
                            />
                        </section>
                    </section>
                    <section class="input-group">
                        <label for="description">Description:</label>
                        <section class="input-wrapper">
                            <textarea id="description" name="description"></textarea>
                        </section>
                    </section>
                    <section class="requirements-group">
                        <section class="required-group">
                            <h4>Requirements:</h4>
                            <p>*</p>
                        </section>
                        <ul id="requirements"></ul>
                        <button type="button" class="transparent-btn" id="add-requirement-btn">Add requirement</button>
                    </section>
                    <section class="details-group">
                        <section class="input-group">
                            <label for="stipend">Stipend:</label>
                            <section class="input-wrapper">
                                <input
                                    type="text"
                                    id="stipend"
                                    name="stipend"
                                    placeholder="Enter the stipend in rands"
                                />
                            </section>
                        </section>
                        <section class="input-group">
                            <label for="duration">Duration:</label>
                            <section class="input-wrapper">
                                <input
                                    type="text"
                                    id="duration"
                                    name="duration"
                                    placeholder="Enter the duration in months"
                                />
                            </section>
                        </section>
                    </section>
                    <section class="details-group">
                        <section class="input-group">
                            <label for="location">Location:</label>
                            <section class="input-wrapper">
                                <input
                                    type="text"
                                    id="location"
                                    name="location"
                                    placeholder="Enter the location of the opportunity"
                                />
                            </section>
                        </section>
                        <section class="input-group">
                            <section class="required-group">
                                <label for="closing-date">Closing Date:</label>
                                <p>*</p>
                            </section>
                            <section class="input-wrapper">
                                <input type="date" id="closing-date" name="closing-date" />
                            </section>
                        </section>
                    </section>
                    <p id="error-message">An error has occurred</p>
                    <button id="submit-btn" class="coloured-btn" type="submit">Resubmit for review</button>
                </form>
            </section>
        </main>
        <script type="module" src="./scripts/edit.js"></script>
        <script type="module" src="../scripts/index.js"></script>
    </body>
</html>
