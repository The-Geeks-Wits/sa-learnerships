<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom View – Analytics</title>
    <link rel="stylesheet" href="../styles/index.css" />
    <link rel="stylesheet" href="./styles/custom.css" />
    <!-- Chart.js for the graph -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <nav>
        <h1 id="app-name">SA - Learnerships</h1>
        <ul>
            <li id="notifications">
                <img src="../assets/notifications.png" />
                <p class="notifications-count">2</p>
            </li>
            <li id="profile-details"></li>
        </ul>
    </nav>
    <main>
        <aside>
            <button id="apply-btn" class="coloured-btn">Apply</button>
            <ul id="sidebar-options">
                <!-- filled by index.js -->
            </ul>
        </aside>
        <section id="main-details">
            <h2>Custom View Report</h2>
            <p>Select dimensions, a metric, and optional filters to generate your report.</p>

            <form id="custom-report-form">
                <!-- Dimensions -->
                <fieldset>
                    <legend>Dimensions (choose at least one)</legend>
                    <section id="dimension-options">
                        <!-- populated by JS -->
                    </section>
                </fieldset>

                <!-- Metric -->
                <fieldset>
                    <legend>Metric</legend>
                    <section id="metric-options">
                        <!-- populated by JS -->
                    </section>
                </fieldset>

                <!-- Filters (optional) -->
                <fieldset>
                    <legend>Filters (optional)</legend>
                    <section id="filter-options">
                        <!-- populated by JS -->
                    </section>
                </fieldset>

                <button type="submit" class="coloured-btn">Generate Report</button>
            </form>

            <!-- Results (hidden initially) -->
            <section id="report-results" class="hidden">
                <h3>Results</h3>
                <section id="chart-container">
                    <canvas id="report-chart"></canvas>
                </section>
                <table id="results-table">
                    <thead id="results-header"></thead>
                    <tbody id="results-body"></tbody>
                </table>
                <section style="margin-top: 16px;">
                    <button id="export-csv" class="coloured-btn">Export CSV</button>
                </section>
            </section>
        </section>
    </main>
    <script type="module" src="../scripts/index.js"></script>
    <script type="module" src="./scripts/custom.js"></script>
</body>
</html>
