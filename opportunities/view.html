<!-- This page is for viewing an opportunity so it needs the id to function accordingly. It is accessible to everyone  -->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title id="browser-title">View Opportunity</title>
        <link rel="stylesheet" href="../styles/index.css" />
        <link rel="stylesheet" href="./styles/view.css" />
        <link rel="stylesheet" href="./styles/common.css" />
    </head>
    <body>
        <nav>
            <h1 id="app-name">SA - Learnerships</h1>
            <ul>
                <li id="notifications">
                    <img src="../assets/notifications.png" />
                    <p class="notifications-count">2</p>
                </li>
                <li id="profile-details"></li>
            </ul>
        </nav>
        <main>
            <aside>
                <button id="apply-btn" class="coloured-btn">Apply</button>
                <ul id="sidebar-options">
                    <li>
                        <section id="applications-nav" class="heading">
                            <p>Applications</p>
                            <img id="applications-nav-image" src="../assets/right-arrow.png" />
                        </section>
                        <section id="applications-nav-options" class="sidebar-nav-options"></section>
                    </li>
                    <li>
                        <section id="opportunities-nav" class="heading">
                            <p>Opportunities</p>
                            <img id="opportunities-nav-image" src="../assets/down-arrow.png" />
                        </section>
                        <section id="opportunities-nav-options"></section>
                    </li>
                    <li>
                        <section id="settings-nav" class="heading">
                            <p>Settings</p>
                            <img id="settings-nav-image" src="../assets/right-arrow.png" />
                        </section>
                        <section id="settings-nav-options">
                            <ul>
                                <li id="profile-nav-tab">
                                    <a href="/profile/view.html">Profile</a>
                                </li>
                                <li id="notifications-nav-tab">
                                    <a href="/notifications/index.html">Notifications</a>
                                    <section>2</section>
                                </li>
                            </ul>
                        </section>
                    </li>
                </ul>
            </aside>
            <section id="main-details">
                <section id="page-state"></section>
                <section id="details-container">
                    <header>
                        <h2 id="page-title"></h2>
                        <p id="status" class="pending"></p>
                    </header>
                    <h3>Description:</h3>
                    <p id="description"></p>
                    <h3>Requirements:</h3>
                    <ul id="requirements"></ul>
                    <section id="details-wrapper">
                        <section>
                            <h3>Stipend:</h3>
                            <p id="stipend"></p>
                        </section>
                        <section>
                            <h3>Duration:</h3>
                            <p id="duration"></p>
                        </section>
                    </section>
                    <section id="details-wrapper">
                        <section>
                            <h3>Location:</h3>
                            <p id="location"></p>
                        </section>
                        <section>
                            <h3>Closing Date:</h3>
                            <p id="closing-date"></p>
                        </section>
                    </section>
                    <section id="actions"></section>
                </section>
            </section>
        </main>
        <script type="module" src="./scripts/view.js"></script>
        <script type="module" src="../scripts/index.js"></script>
    </body>
</html>
