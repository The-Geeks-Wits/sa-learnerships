<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Profile</title>
        <link rel="stylesheet" href="./styles/edit.css" />
        <link rel="stylesheet" href="../styles/index.css" />
    </head>
    <body>
        <nav>
            <h1 id="app-name">SA - Learnerships</h1>
            <ul>
                <li id="notifications">
                    <img src="../assets/notifications.png" />
                    <p id="count">2</p>
                </li>
                <li id="profile-details"></li>
            </ul>
        </nav>
        <main>
            <aside>
                <button id="apply-btn" class="coloured-btn">Apply</button>
                <ul id="sidebar-options">
                    <li>
                        <section id="opportunities-nav" class="heading">
                            <p>Opportunities</p>
                            <img id="opportunities-nav-image" src="../assets/right-arrow.png" />
                        </section>
                        <section id="opportunities-nav-options"></section>
                    </li>
                    <li>
                        <section class="heading">
                            <p>Your Account</p>
                            <img src="../assets/right-arrow.png" />
                        </section>
                    </li>
                    <li>
                        <section class="heading">
                            <p>Settings</p>
                            <img src="../assets/right-arrow.png" />
                        </section>
                    </li>
                </ul>
            </aside>
            <section id="main-details">
                <h2 id="page-title">Edit Profile</h2>
                <ul id="profile">
                    <li id="profile-tab">
                        <ul>
                            <li id="personal-tab" class="visible"><p>Personal</p></li>
                            <li id="education-tab"><p>Education</p></li>
                            <li id="skills-tab"><p>Skills</p></li>
                        </ul>
                    </li>
                    <li id="visible-profile-details"></li>
                </ul>
            </section>
        </main>
        <script type="module" src="./scripts/edit.js"></script>
        <script type="module" src="../scripts/index.js"></script>
    </body>
</html>
