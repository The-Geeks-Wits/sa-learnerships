<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Profile</title>
        <link rel="stylesheet" href="../styles/index.css" />
        <link rel="stylesheet" href="./styles/view.css" />
    </head>
    <body>
        <nav>
            <h1 id="app-name">SA - Learnerships</h1>
            <ul>
                <li id="notifications">
                    <img src="../assets/notifications.png" />
                    <p id="count">2</p>
                </li>
                <li id="profile-details"></li>
            </ul>
        </nav>
        <main>
            <aside>
                <button id="apply-btn" class="coloured-btn">Apply</button>
                <ul id="sidebar-options">
                    <li>
                        <section id="applications-nav" class="heading">
                            <p>Applications</p>
                            <img id="applications-nav-image" src="../assets/right-arrow.png" />
                        </section>
                        <section id="applications-nav-options" class="sidebar-nav-options"></section>
                    </li>
                    <li>
                        <section id="opportunities-nav" class="heading">
                            <p>Opportunities</p>
                            <img id="opportunities-nav-image" src="../assets/right-arrow.png" />
                        </section>
                        <section id="opportunities-nav-options"></section>
                    </li>
                    <li>
                        <section id="settings-nav" class="heading">
                            <p>Settings</p>
                            <img id="settings-nav-image" src="../assets/down-arrow.png" />
                        </section>
                        <section id="settings-nav-options">
                            <ul>
                                <li id="profile-nav-tab">
                                    <a href="/profile/view.html">Profile</a>
                                </li>
                                <li id="notifications-nav-tab">
                                    <a href="/notifications/index.html">Notifications</a>
                                    <section>2</section>
                                </li>
                            </ul>
                        </section>
                    </li>
                </ul>
            </aside>
            <section id="main-details">
                <h2 id="page-title">Your Profile</h2>
                <ul id="profile">
                    <li id="personal-details"></li>
                    <li id="profile-tab">
                        <ul>
                            <li id="personal-tab" class="visible"><p>Personal</p></li>
                            <li id="education-tab"><p>Education</p></li>
                            <li id="skills-tab"><p>Skills</p></li>
                            <li id="attachments-tab"><p>Attachments</p></li>
                        </ul>
                    </li>
                    <li id="visible-profile-details"></li>
                </ul>
                <section id="page-state"></section>
                <section id="page-error"></section>
            </section>
        </main>
        <script type="module" src="./scripts/view.js"></script>
        <script type="module" src="../scripts/index.js"></script>
    </body>
</html>
